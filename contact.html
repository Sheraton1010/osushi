<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="都寿司へのお問い合わせ。ご予約やご相談はお電話またはフォームからどうぞ。">
  <title>お問い合わせ | 都寿司</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="site-header" id="top">
    <a class="brand" href="index.html"><span class="brand-mark">都</span><span><strong>都寿司</strong><small>Miyako Sushi</small></span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
    <nav class="site-nav" id="site-nav" aria-label="メインナビゲーション">
      <a href="index.html">ホーム</a><a href="menu.html">お品書き</a><a href="kodawari.html">こだわり</a><a href="contact.html" aria-current="page">お問い合わせ</a><a class="nav-tel" href="tel:000-1234-5678">000-1234-5678</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <img src="img/contact1600hashi.jpg" alt="箸と和食器">
      <div>
        <p class="eyebrow">Contact</p>
        <h1>お問い合わせ</h1>
        <p>ご予約、貸切、アレルギーのご相談など、お気軽にお問い合わせください。</p>
      </div>
    </section>

    <section class="section contact-layout">
      <div class="contact-card">
        <p class="eyebrow">Reservation</p>
        <h2>お電話でのご予約</h2>
        <p>お急ぎの場合はお電話が確実です。営業時間中にお問い合わせください。</p>
        <a class="button primary" href="tel:000-1234-5678">000-1234-5678</a>
      </div>

      <form class="contact-form" action="#" method="post">
        <div>
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div>
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div>
          <label for="message">お問い合わせ内容</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button class="button primary" type="submit">送信する</button>
      </form>
    </section>
  </main>

  <footer class="site-footer"><p>&copy; Miyako Sushi</p><a href="#top" class="back-to-top">ページ上部へ</a></footer>
  <script src="js/main.js"></script>
</body>
</html>
